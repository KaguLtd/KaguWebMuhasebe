name: docs-devops

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/muhasebe-web/**"
      - "prisma/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/muhasebe-web/**"
      - "prisma/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: docs-devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kagu_ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d kagu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/muhasebe-web
    env:
      AUTH_SECRET: ci-not-for-production
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kagu_ci?schema=public
      KAGU_APP_ORIGIN: https://muhasebe.kagultd.com
      KAGU_BACKUP_PLAN_ACK: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/muhasebe-web/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production readiness
        run: npm run production:check
